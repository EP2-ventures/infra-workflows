name: Reusable Deploy

on:
  workflow_call:
    inputs:
      service:
        description: "Service to deploy (backend or frontend)"
        required: true
        type: string
      project:
        description: "Project name (e.g. boanalytics)"
        required: true
        type: string
      image_name:
        description: "GHCR image name (e.g. ep2-ventures/boanalytics-backend)"
        required: true
        type: string
      image_tag:
        description: "Image tag to deploy"
        required: true
        type: string
      infra_repo:
        description: "Infra repo (owner/repo) to copy docker-compose from"
        required: true
        type: string
      infra_ref:
        description: "Branch or ref to checkout from infra repo"
        required: false
        type: string
        default: "main"
      environment:
        description: "GitHub environment name for deployment tracking (e.g. staging)"
        required: false
        type: string
        default: ""
      environment_url:
        description: "URL shown in GitHub deployment status (e.g. https://api.boanalytics.ep2.ventures)"
        required: false
        type: string
        default: ""
    secrets:
      INFRA_TOKEN:
        description: "PAT with read access to the infra repo"
        required: true
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true
      DEPLOY_SSH_KEY:
        required: true
      DOPPLER_TOKEN:
        description: "Doppler service token to regenerate .env on VPS"
        required: false
      GHCR_TOKEN:
        description: "Token with read:packages scope to pull images from GHCR on the VPS"
        required: false

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || inputs.project }}
      url: ${{ inputs.environment_url || '' }}
    concurrency:
      group: deploy-${{ inputs.project }}
      cancel-in-progress: false

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.infra_repo }}
          ref: ${{ inputs.infra_ref }}
          path: _infra
          token: ${{ secrets.INFRA_TOKEN }}

      - name: Copy docker-compose to VPS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            _infra/projects/${{ inputs.project }}/docker-compose.prod.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/${{ inputs.project }}/"
          rm -f ~/.ssh/deploy_key

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DOPPLER_TOKEN,GHCR_TOKEN
          script: |
            set -eo pipefail

            PROJECT="${{ inputs.project }}"
            SERVICE="${{ inputs.service }}"
            IMAGE="${{ env.REGISTRY }}/${{ inputs.image_name }}:${{ inputs.image_tag }}"

            echo "--- Deploying ${SERVICE} (${IMAGE}) ---"

            cd /opt/${PROJECT}

            # Per-service image tag variable (e.g. BACKEND_IMAGE_TAG, LANDING_V0_IMAGE_TAG)
            # Hyphens are converted to underscores to produce valid shell variable names.
            SVC_TAG_VAR="$(echo "${SERVICE}" | tr '[:lower:]-' '[:upper:]_')_IMAGE_TAG"

            # ── A ROLLBACK MUST SURVIVE THE OTHER SERVICE'S NEXT DEPLOY ──────────
            #
            # This block used to write the Doppler dump plus ONLY the deploying
            # service's `<SVC>_IMAGE_TAG` and `mv` it over .env. .env is REPLACED,
            # not amended, so every other service's pin was dropped and compose then
            # resolved that service to `${...:-latest}` on its next recreate — a
            # reboot, a daemon restart, a plain `compose up -d`. So rolling service A
            # back to a known-good image and then deploying service B left A due to
            # jump FORWARD to `latest`, i.e. back to the image you had just rolled
            # away from, the moment anything restarted it.
            #
            # Measured on privilege-gardens' live host 2026-08-20: /opt/privilege-
            # gardens/.env held ADMIN_IMAGE_TAG=snapshot-production-77-fb75ad0 and
            # ZERO LANDING_IMAGE_TAG lines, while `docker compose config` resolved
            # landing to `:latest` and the running container was on
            # snapshot-production-77-fb75ad0. Harmless only because `latest` happened
            # to be the same digest that day.
            #
            # Neither obvious workaround helped, because both only move WHICH service
            # is unpinned: deploying the other service too makes ITS regeneration drop
            # the first one's pin, and `service: all` serializes the two so the last
            # one wins. Exactly one service was ever pinned — whichever deployed last.
            #
            # So: carry every pre-existing *_IMAGE_TAG across the regeneration, and
            # write this deploy's own pins LAST. Deliberately by DELETING then
            # APPENDING rather than relying on a later duplicate line winning: the
            # previous code assumed compose's parser takes the last definition and
            # nothing here ever verified it. Every key now appears exactly once, so
            # the result does not depend on that assumption at all.
            preserve_pins() {
              # $1 = file being built. Copies forward the pins in the LIVE .env that
              # this deploy is not itself setting.
              [ -f .env ] || return 0
              grep -E '^[A-Za-z0-9_]+_IMAGE_TAG=' .env > .env.pins || true
              while IFS= read -r line; do
                key="${line%%=*}"
                # Skip the ones this deploy sets below — they must not be carried
                # forward stale, and they are appended last anyway.
                [ "$key" = "$SVC_TAG_VAR" ] && continue
                sed -i "/^${key}=/d" "$1"
                printf '%s\n' "$line" >> "$1"
                echo "  carried forward: ${key}"
              done < .env.pins
              rm -f .env.pins
            }

            if [ -n "$DOPPLER_TOKEN" ]; then
              echo "--- Refreshing secrets from Doppler ---"
              doppler secrets download --format env --no-file > .env.tmp
              preserve_pins .env.tmp
              # This deploy's own pins, last, with any duplicate removed first so
              # each key is written exactly once.
              sed -i '/^IMAGE_TAG=/d' .env.tmp
              sed -i "/^${SVC_TAG_VAR}=/d" .env.tmp
              echo "IMAGE_TAG=${{ inputs.image_tag }}" >> .env.tmp
              echo "${SVC_TAG_VAR}=${{ inputs.image_tag }}" >> .env.tmp
              mv .env.tmp .env
            else
              echo "--- No DOPPLER_TOKEN, using existing .env ---"
              # This path already amends in place, so other services' pins were never
              # at risk here. Left equivalent, only made key-unique like the branch
              # above.
              [ -f .env ] || : > .env
              sed -i '/^IMAGE_TAG=/d' .env
              sed -i "/^${SVC_TAG_VAR}=/d" .env
              echo "IMAGE_TAG=${{ inputs.image_tag }}" >> .env
              echo "${SVC_TAG_VAR}=${{ inputs.image_tag }}" >> .env
            fi

            echo "--- image pins now in .env ---"
            grep -E '^[A-Za-z0-9_]*IMAGE_TAG=' .env | sed 's/^/  /'

            echo "--- .env keys ---"
            grep -v '^#' .env | grep -v '^$' | cut -d= -f1 | while read key; do
              echo "  ${key}"
            done
            echo "---"

            # Authenticate with GHCR if token is provided
            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u x --password-stdin
            fi

            docker compose -f docker-compose.prod.yml pull ${SERVICE}
            docker compose -f docker-compose.prod.yml up -d ${SERVICE}

            # Verify health
            CONTAINER="${PROJECT}-${SERVICE}"
            TIMEOUT=60
            echo "--- Verifying health (${CONTAINER}) ---"
            STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER" 2>/dev/null || echo "none")
            if [ "$STATUS" = "none" ]; then
              echo "No healthcheck defined, skipping"
            else
              for i in $(seq 1 $TIMEOUT); do
                STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo "unknown")
                case "$STATUS" in
                  healthy)
                    echo "Service healthy after ${i}s"
                    break
                    ;;
                  unhealthy)
                    echo "ERROR: Service unhealthy"
                    docker logs "$CONTAINER" --tail 30
                    exit 1
                    ;;
                esac
                if [ "$i" = "$TIMEOUT" ]; then
                  echo "ERROR: Health check timeout (${TIMEOUT}s)"
                  docker logs "$CONTAINER" --tail 30
                  exit 1
                fi
                sleep 1
              done
            fi

            docker image prune -f --filter "until=168h"
            echo "--- Deploy complete ---"

      - name: Summary
        run: |
          echo "### Deploy complete :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Project** | \`${{ inputs.project }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Service** | \`${{ inputs.service }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image** | \`${{ inputs.image_name }}:${{ inputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
