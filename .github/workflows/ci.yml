name: CI

# This repository has no application code, so nothing here ran until 2026-08-21 —
# and its two workflows are consumed by every estate project through `@v1`, which
# makes it the highest-blast-radius repo in the estate with the least coverage.
# Start with the one behaviour that has already been wrong in production.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: Deploy-script regression tests
    # ubuntu, not macos: the tests exercise the workflow's own `sed -i`, which is
    # GNU's on the deploy host. The test refuses to run under BSD sed rather than
    # reporting a platform difference as a defect.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/env-pin-preservation.sh
      # A suite that cannot go red is a decoration that looks exactly like a gate,
      # so the discrimination is enforced, not asserted once in a PR comment: this
      # breaks the workflow four ways and requires each break to surface as a named
      # failure of the case that owns it. Seconds, no network.
      - run: bash tests/mutants.sh

  lint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, not `:latest`. This job fails the build on ANY finding, and the
      # only thing keeping it green is `.github/actionlint.yaml`, whose ignore is
      # a LITERAL message string ("shellcheck reported issue in this script:
      # SC2129"). A floating tag lets a future release change that wording, or add
      # a rule, and turn `main` red with no commit to blame — the gate would stop
      # being about this repo's code. 1.7.12 is the version the SC2129 baseline
      # and its negative control were actually measured against, and it is the
      # exact image CI already ran: `rhysd/actionlint:latest` and
      # `rhysd/actionlint:1.7.12` both resolve to
      # sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667,
      # which is the digest run 33634293434 pulled. So this pin changes no
      # behaviour today; it only stops it changing tomorrow.
      #
      # A tag and not a digest on purpose: this repo's Actions policy is
      # `selected` and its pattern for this image is `docker://rhysd/actionlint:*`,
      # which matches a tag. `docker://rhysd/actionlint@sha256:...` would not, and
      # a non-matching action is a `startup_failure` — a job that never runs, which
      # is the exact failure mode this branch was opened under.
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
